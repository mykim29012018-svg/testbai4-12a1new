const QUESTION_BANK = [{"text": "Nhiệt dung riêng của một chất cho biết nhiệt lượng cần truyền cho", "options": ["một vật làm bằng chất đó để nhiệt độ tăng thêm 1 °C.", "1 kg chất đó để nhiệt độ tăng thêm 1 °C.", "1 kg chất đó để chuyển hoàn toàn từ thể rắn sang thể lỏng.", "một vật làm bằng chất đó để nhiệt độ tăng gấp đôi."], "answer": 1, "graph": null}, {"text": "Hai mẫu chất A và B có cùng khối lượng và cùng nhiệt độ ban đầu. Khi nhận cùng một nhiệt lượng, nhiệt độ mẫu A tăng thêm 10 °C, còn mẫu B tăng thêm 20 °C. Bỏ qua thất thoát nhiệt và sự chuyển thể. Nhận xét nào đúng?", "options": ["Nhiệt dung riêng của A bằng một nửa của B.", "Nhiệt dung riêng của A gấp hai lần của B.", "Nhiệt dung riêng của A bằng của B.", "Nhiệt dung riêng của A gấp bốn lần của B."], "answer": 1, "graph": null}, {"text": "Trong quá trình một vật nhận nhiệt và tăng nhiệt độ, không xảy ra sự chuyển thể, phát biểu nào sau đây đúng?", "options": ["Nội năng của vật tăng.", "Khối lượng của vật tăng.", "Nhiệt dung riêng của vật luôn bằng không.", "Vật nhất thiết phải nóng chảy."], "answer": 0, "graph": null}, {"text": "Nhiệt dung riêng của nước là 4 200 J/(kg·K). Điều này có nghĩa là", "options": ["1 kg nước ở mọi nhiệt độ đều chứa nhiệt lượng 4 200 J.", "cung cấp 4 200 J thì mọi lượng nước đều tăng nhiệt độ thêm 1 K.", "muốn làm 1 kg nước hóa hơi hoàn toàn cần cung cấp 4 200 J.", "muốn làm 1 kg nước tăng nhiệt độ thêm 1 K cần truyền cho nước 4 200 J, khi không có sự chuyển thể."], "answer": 3, "graph": null}, {"text": "Khi sử dụng công thức Q = mcΔT, nếu độ tăng nhiệt độ được xác định bằng thang Celsius thì", "options": ["phải cộng thêm 273,15 vào độ tăng nhiệt độ.", "có thể dùng trực tiếp vì độ tăng 1 °C bằng độ tăng 1 K.", "phải nhân độ tăng nhiệt độ với 273,15.", "không thể tính nhiệt lượng vì công thức chỉ áp dụng với thang Kelvin."], "answer": 1, "graph": null}, {"text": "Trong cùng điều kiện nhiệt độ, nhiệt dung riêng là đại lượng đặc trưng cho", "options": ["hình dạng của vật.", "khối lượng của vật.", "chất cấu tạo nên vật.", "thể tích của vật."], "answer": 2, "graph": null}, {"text": "Nhiệt dung riêng của nhôm là 900 J/(kg·K). Khi chia một khối nhôm thành hai phần có khối lượng khác nhau, ở cùng nhiệt độ, nhiệt dung riêng của mỗi phần là", "options": ["900 J/(kg·K).", "450 J/(kg·K).", "1 800 J/(kg·K).", "phụ thuộc vào khối lượng của phần đó."], "answer": 0, "graph": null}, {"text": "Nước thường được dùng làm chất tải nhiệt trong hệ thống làm mát. Xét riêng về nhiệt dung riêng, nguyên nhân là nước", "options": ["có nhiệt dung riêng nhỏ nên dễ nóng lên.", "không thay đổi nhiệt độ khi nhận nhiệt.", "luôn có nhiệt độ thấp hơn các chất khác.", "có nhiệt dung riêng lớn nên có thể nhận nhiều nhiệt mà nhiệt độ tăng tương đối ít."], "answer": 3, "graph": null}, {"text": "Một cốc nước nóng được để trong phòng có nhiệt độ thấp hơn nhiệt độ của nước. Trong quá trình nước nguội đi, nước", "options": ["thu nhiệt từ không khí.", "tỏa nhiệt ra môi trường.", "không trao đổi nhiệt với môi trường.", "tăng nội năng."], "answer": 1, "graph": null}, {"text": "Đồ thị biểu diễn nhiệt độ t theo nhiệt lượng Q mà một mẫu chất nhận được. Mẫu không chuyển thể và có khối lượng không đổi. Đồ thị là đường thẳng đi lên. Nhận xét nào đúng?", "options": ["Nhiệt dung riêng của mẫu tăng khi nhiệt độ tăng.", "Nhiệt lượng mẫu nhận được tỉ lệ thuận với nhiệt độ Celsius của mẫu.", "Nhiệt lượng mẫu nhận được tỉ lệ thuận với độ tăng nhiệt độ của mẫu.", "Mẫu nhận nhiệt lượng nhưng nhiệt độ không thay đổi."], "answer": 2, "graph": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABXgAAANcCAYAAADl5sctAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAewgAAHsIBbtB1PgAAjP5JREFUeJzs3Xl8JHd95/93Hzpb1+js0lyakVSae0YlEzvYP0MgPmJYsIcQkzXEZgOBJIRkd8kjZAmw4XhANuDdLMsGL2CO4NjGiSHEBsdctmOMOaY0h+dQSZrRXKrWrZHUOlrdXb8/JlasOdWabkndej0fjzzS1VPfT7+bGfdI7ynV1+d5nicAAAAAAAAAQNbxL3cAAAAAAAAAAMDiUPACAAAAAAAAQJai4AUAAAAAAACALEXBCwAAAAAAAABZioIXAAAAAAAAALIUBS8A let QUESTIONS = QUESTION_BANK.slice();
function shuffle(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepareQuestions(){QUESTIONS=[...shuffle(QUESTION_BANK.filter(q=>q.options)),...shuffle(QUESTION_BANK.filter(q=>!q.options))]}
const KEY='nhiet-dung-rieng-v1-result';
let answers=Array(15).fill(null),pos=0,running=false,finished=false,deadline=0,clock,result;
const el=id=>document.getElementById(id);
function render(){const q=QUESTIONS[pos];el('count').textContent='Câu '+(pos+1)+' / 15';const box=el('question');box.replaceChildren();let text=document.createElement('p');text.textContent=q.text;box.append(text);if(q.graph){let i=document.createElement('img');i.src=q.graph;i.alt='Đồ thị nhiệt độ t (°C) theo nhiệt lượng Q (kJ)';box.append(i)}if(q.options){q.options.forEach((o,i)=>{let l=document.createElement('label');l.className='option';let input=document.createElement('input');input.type='radio';input.name='choice';input.checked=answers[pos]===i;input.onchange=()=>{answers[pos]=i;nav()};let t=document.createElement('span');t.textContent='ABCD'[i]+'. '+o;l.append(input,t);box.append(l)})}else{let l=document.createElement('label');l.textContent='Nhập kết quả bằng số (không ghi đơn vị):';let input=document.createElement('input');input.type='text';input.inputMode='decimal';input.placeholder='Ví dụ: 12,5';input.value=answers[pos]??'';input.oninput=()=>{answers[pos]=input.value;nav()};l.append(input);box.append(l)}el('prev').disabled=pos===0;el('next').disabled=pos===14;nav()}
function has(a){return a!==null&&String(a).trim()!==''}
function nav(){el('nav').replaceChildren();answers.forEach((a,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className=(has(a)?'done ':'')+(i===pos?'active':'');b.onclick=()=>{pos=i;render()};el('nav').append(b)});el('answered').textContent='Đã trả lời '+answers.filter(has).length+'/15 câu'}
function tick(){let s=Math.max(0,Math.ceil((deadline-Date.now())/1000));el('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s===0)submit('Hết thời gian')}
function show(){el('start').hidden=true;el('test').hidden=true;el('result').hidden=false;el('student').textContent=result.name+' • Lớp '+result.className;el('score').textContent='Điểm: '+result.score.toFixed(2).replace('.',',')+' / 10';el('reason').textContent='';el('delivery').textContent=''}
function submit(reason){if(!running||finished)return;finished=true;running=false;clearInterval(clock);let correct=0;QUESTIONS.forEach((q,i)=>{if(q.options){if(answers[i]===q.answer)correct++}else if(has(answers[i])){let v=String(answers[i]).trim().replace(',','.');if(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(v)&&Math.abs(Number(v)-q.answer)<1e-6)correct++}});result={attemptId:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:el('name').value.trim(),className:el('className').value.trim(),quiz:'Nhiệt dung riêng – Vật lí 12',score:Number((correct*10/15).toFixed(2)),correct,total:15,reason,submittedAt:new Date().toISOString(),durationSeconds:Math.min(600,Math.max(0,Math.round((Date.now()-(deadline-600000))/1000)))};try{localStorage.setItem(KEY,JSON.stringify(result))}catch(e){}show();if(SCORE_ENDPOINT){try{let body=new URLSearchParams({payload:JSON.stringify(result)});let queued=navigator.sendBeacon(SCORE_ENDPOINT,body);if(queued)el('delivery').textContent='Đã gửi yêu cầu chuyển điểm. Kết quả cũng được lưu trên thiết bị; chưa xác nhận dữ liệu đã ghi vào bảng điểm.';else fetch(SCORE_ENDPOINT,{method:'POST',body,mode:'no-cors',keepalive:true}).then(()=>{el('delivery').textContent='Đã gửi yêu cầu chuyển điểm; chưa xác nhận dữ liệu đã ghi vào bảng điểm.'}).catch(()=>{el('delivery').textContent='Chưa gửi được điểm. Hãy tải kết quả để nộp cho giáo viên.'})}catch(e){el('delivery').textContent='Chưa gửi được điểm. Hãy tải kết quả để nộp cho giáo viên.'}}}
el('entry').onsubmit=e=>{e.preventDefault();if(!el('name').value.trim()||!el('className').value.trim())return;prepareQuestions();answers=Array(QUESTIONS.length).fill(null);pos=0;running=true;deadline=Date.now()+600000;el('start').hidden=true;el('test').hidden=false;render();tick();clock=setInterval(tick,500)};el('prev').onclick=()=>{if(pos>0){pos--;render()}};el('next').onclick=()=>{if(pos<14){pos++;render()}};el('submit').onclick=()=>{if(confirm('Nộp bài và kết thúc làm bài?'))submit('Học sinh nộp bài')};document.addEventListener('visibilitychange',()=>{if(document.hidden)submit('Chuyển tab hoặc ẩn trang')});window.addEventListener('pagehide',()=>submit('Rời trang'));window.addEventListener('beforeunload',()=>submit('Rời hoặc tải lại trang'));el('download').onclick=()=>{let blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Ket_qua_nhiet_dung_rieng.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
